[package]
name = "fossil-codec"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Platform-neutral tiered v1 run and summary codec shared by Fossil and its Worker"

[dependencies]
anyhow = "1.0"
hex = "0.4"
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zstd = { version = "0.13", optional = true }

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = ["build"]
# Run construction needs the native zstd encoder; readers (including wasm) do not.
build = ["dep:zstd"]
