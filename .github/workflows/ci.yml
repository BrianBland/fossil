name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo fmt --manifest-path codec/Cargo.toml -- --check
      - run: cargo clippy --manifest-path codec/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path codec/Cargo.toml --no-default-features -- -D warnings
      - run: cargo test --manifest-path codec/Cargo.toml

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo check --target wasm32-unknown-unknown
      - run: npm ci
      - run: cargo install worker-build --version 0.8.6 --locked
      - run: npm run build
